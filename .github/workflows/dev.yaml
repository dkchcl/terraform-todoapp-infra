name: "Dev Terraform Workflow"
  
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main      

permissions:
  id-token: write
  contents: read
  
jobs: 
  terraform-init-plan:
    runs-on: ubuntu-latest
    environment: dev
    steps: 
      - name: Checkout
        uses: actions/checkout@v5.0.0
    
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: d1db05bf-b643-4e69-a734-0516cd425c22
          tenant-id: b511aa26-fbd4-46c6-bd77-c84dcc046ce1
          subscription-id: 009fad33-c09c-4841-af38-57dd79870d40

      - name: Setup Terraform
        uses: autero1/action-terraform@v3
        with:
          terraform-version: 1.2.8
      - name: Interact with Terraform
        run: terraform --version 
        
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
        working-directory: environments/dev
        
      - name: Terraform Init
        id: init             
        run: |
          # Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          terraform init -input=false              
        working-directory: environments/dev

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: environments/dev        
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true
        working-directory: environments/dev    
        
  terraform-apply:    
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: terraform-init-plan
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
    
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: d1db05bf-b643-4e69-a734-0516cd425c22
          tenant-id: b511aa26-fbd4-46c6-bd77-c84dcc046ce1
          subscription-id: 009fad33-c09c-4841-af38-57dd79870d40 
          
      - name: Terraform Init
        id: init
        run: terraform init -input=false  
        working-directory: environments/dev

      - name: Terraform Apply
        id: apply
        run: terraform apply --auto-approve
        continue-on-error: true
        working-directory: environments/dev   
        
      - name: Terraform Destroy
        id: destroy
        run: terraform destroy --auto-approve
        continue-on-error: true
        working-directory: environments/dev 
          
